[package]
name = "nbio"
version = "0.23.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Eric Thill"]
repository = "https://github.com/thill/nbio"
description = "Non-Blocking I/O"
keywords = ["tcp", "http", "nonblocking"]
categories = ["concurrency", "rust-patterns"]
exclude = ["Cargo.lock"]

[features]
default = ["crossbeam", "http", "mock", "mpsc", "tcp", "websocket"]
aeron = ["dep:libaeron-sys"]
crossbeam = ["dep:crossbeam-channel"]
http = ["tcp", "dep:chunked_transfer", "dep:http", "dep:httparse"]
mock = []
mpsc = []
tcp = ["libc", "mio", "dep:tcp-stream"]
websocket = ["http", "rand", "tcp", "dep:tungstenite"]

[dependencies]
chunked_transfer = { version = "1.5.0", optional = true }
circbuf = "0.2.1"
crossbeam-channel = { version = "0.5.17", optional = true }
http = { version = "1.5.0", optional = true }
libc = { version = "0.2.191", optional = true }
mio = { version = "1.2.5", features = ["net", "os-poll"], optional = true }
native-tls = "0.2.18"
rustls-pemfile = "2.2.0"
httparse = { version = "1.10.1", optional = true }
libaeron-sys = { version = "1.54.2", optional = true }
rand = { version = "0.10.4", optional = true }
tcp-stream = { version = "0.34.17", optional = true, default-features = false, features = ["native-tls", "rustls--aws_lc_rs", "rustls-native-certs"]  }
tungstenite = { version = "0.30.0", optional = true }
